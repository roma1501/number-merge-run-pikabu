<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Числовой забег</title>
    <link rel="icon" type="image/png" href="assets/branding/favicon.png">
    <style>
        @font-face { font-family: 'NM Nunito'; src: url('assets/fonts/nunito.ttf?v=0.1.0-b3b10521') format('truetype'); font-weight: 200 1000; font-style: normal; font-display: swap; }
        @font-face { font-family: 'NM Titan'; src: url('assets/fonts/titanone.ttf?v=0.1.0-b3b10521') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #bfe7fb;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: radial-gradient(circle at 18% 6%, #fffbe6 0, rgba(255,255,255,0) 32%), linear-gradient(#2fb3f3, #7ad0f6 55%, #d4f1fd);
            z-index: 1000;
        }
        .loading-text {
            font: 800 15px 'NM Nunito', system-ui, sans-serif;
            color: #ffffff;
            text-shadow: 0 1px 0 #2b5bc4;
            text-align: center;
            min-height: 1em;
        }
        .loading-bar {
            width: min(260px, 70vw);
            height: 18px;
            background: rgba(255,255,255,.6);
            border-radius: 99px;
            padding: 3px;
            box-sizing: border-box;
            box-shadow: inset 0 2px 4px rgba(30,60,140,.2);
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #55e6b0, #3fb7ff);
            border-radius: 99px;
            transition: width 0.3s ease;
        }
        #loading-title { margin: 0; font: 400 clamp(30px, 7vw, 52px)/1.05 'NM Titan', system-ui, sans-serif; color: #fff; text-align: center; max-width: 86vw; -webkit-text-stroke: 3px #2f7df6; paint-order: stroke fill; filter: drop-shadow(0 5px 0 rgba(20,60,160,.25)); }
        .engine-mark { font: 400 clamp(64px, 16vh, 120px)/1 'NM Titan', system-ui, sans-serif; color: #2f7df6; -webkit-text-stroke: 4px #fff; paint-order: stroke fill; animation: nm-load-bounce .9s ease-in-out infinite; filter: drop-shadow(0 8px 0 rgba(20,60,160,.2)); }
        @keyframes nm-load-bounce { 0%,100% { transform: translateY(0) scale(1,1); } 40% { transform: translateY(-14px) scale(.94,1.08); } 70% { transform: translateY(0) scale(1.1,.9); } }
        #loading-percent { font: 400 18px 'NM Titan', system-ui, sans-serif; color: #fff; text-shadow: 0 2px 0 #2b5bc4; }
        #loading-retry { padding: 12px 26px; border: 0; border-radius: 16px; background: linear-gradient(#69b4ff, #2f7df6); color: #fff; font: 900 16px 'NM Nunito', system-ui, sans-serif; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <div class="engine-mark" aria-hidden="true">1</div>
        <h1 id="loading-title">Числовой забег</h1>
        <div id="loading-percent">0%</div>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div class="loading-text" data-t="loading">Загрузка…</div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <!-- Порядок значим: Constants.js первым (остальные читают его глобалы), main.js последним -->
    <script src="https://games.pikabu.ru/sdk/sdk.js"></script>
<script src="js/Constants.js?v=0.1.0-b3b10521"></script>
    <!-- 1.40 ads-ui: поле игры на десктопе не шире 2:1 (Playgama); вторым — его resize идёт раньше обработчиков движка -->
    <script src="js/ViewCap.js?v=0.1.0-b3b10521"></script>

    <script src="libs/babylon.js?v=0.1.0-b3b10521"></script>
    <script src="js/Maps.js?v=0.1.0-b3b10521"></script>
    <script src="js/Maps2D.js?v=0.1.0-b3b10521"></script>
    <script src="js/World2D.js?v=0.1.0-b3b10521"></script>
    <script src="js/World3D.js?v=0.1.0-b3b10521"></script>
    <script src="js/Terrain3D.js?v=0.1.0-b3b10521"></script>
    <script src="js/CameraControl.js?v=0.1.0-b3b10521"></script>
    <!-- 1.40: камера не заслоняется сценой (столкновение, полупрозрачные заслоны) -->
    <script src="js/CameraSight.js?v=0.1.0-b3b10521"></script>
    <script src="js/Model3D.js?v=0.1.0-b3b10521"></script>
    <script src="js/ModelFBX.js?v=0.1.0-b3b10521"></script>
    <script src="js/ModelOBJ.js?v=0.1.0-b3b10521"></script>
    <script src="js/ModelGLTF.js?v=0.1.0-b3b10521"></script>
    <script src="js/Location3D.js?v=0.1.0-b3b10521"></script>
    <!-- world-a: Rig.js (риги и клипы), Nav.js (коллизии, высоты, пути) -->
    <script src="js/Rig.js?v=0.1.0-b3b10521"></script>
    <script src="js/Nav.js?v=0.1.0-b3b10521"></script>
    <!-- 1.30 мир (world-b): уровни графики и время суток -->
    <script src="js/Quality.js?v=0.1.0-b3b10521"></script>
    <script src="js/Sky3D.js?v=0.1.0-b3b10521"></script>
    <script src="js/Pause.js?v=0.1.0-b3b10521"></script>
    <script src="js/Sound.js?v=0.1.0-b3b10521"></script>
    <script src="js/Lang.js?v=0.1.0-b3b10521"></script>
    <script src="js/Platform.js?v=0.1.0-b3b10521"></script>
    <!-- Адаптеры площадок (Platform.register): Playgama; игра добавляет свои здесь же, после Platform.js -->
    <script src="js/PlatformPlaygama.js?v=0.1.0-b3b10521"></script>
    <!-- Адаптеры Telegram Mini App, CrazyGames, Android-обёртки и сборки test (detect() выбирает площадку) -->
    <script src="js/PlatformTelegram.js?v=0.1.0-b3b10521"></script>
    <script src="js/PlatformCrazy.js?v=0.1.0-b3b10521"></script>
    <script src="js/PlatformPikabu.js?v=0.1.0-b3b10521"></script>
    <script src="js/PlatformAndroid.js?v=0.1.0-b3b10521"></script>
    <script src="js/PlatformTest.js?v=0.1.0-b3b10521"></script>
    <script src="js/LoadingScreen.js?v=0.1.0-b3b10521"></script>
    <script src="js/ParticleFX.js?v=0.1.0-b3b10521"></script>
    <script src="js/Telemetry.js?v=0.1.0-b3b10521"></script>
    <!-- 1.30 systems-b: магазин косметики, Daily Gift, колесо фортуны (логика без UI, опт-ин: Shop/DailyGift/Wheel.init в Game.js) -->
    <script src="js/Shop.js?v=0.1.0-b3b10521"></script>
    <script src="js/DailyGift.js?v=0.1.0-b3b10521"></script>
    <script src="js/Wheel.js?v=0.1.0-b3b10521"></script>
    <!-- 1.30 systems-a: ввод, раскладка HUD, обучение. Opt-in: игра сама зовёт Input.init / HudLayout.init / Tutorial.init -->
    <script src="js/HudLayout.js?v=0.1.0-b3b10521"></script>
    <script src="js/Input.js?v=0.1.0-b3b10521"></script>
    <script src="js/Tutorial.js?v=0.1.0-b3b10521"></script>
    <script src="js/LiveWater3D.js?v=0.1.0-b3b10521"></script>
    <!-- 1.40 motion: физический блочный персонаж (opt-in). Порядок значим: MotionMath (GM) -> Humanoid -> MotionMatch -> CharacterPhysics -> Ragdoll -> Character -->
    <script src="js/MotionMath.js?v=0.1.0-b3b10521"></script>
    <script src="js/Humanoid.js?v=0.1.0-b3b10521"></script>
    <script src="js/MotionMatch.js?v=0.1.0-b3b10521"></script>
    <script src="js/CharacterPhysics.js?v=0.1.0-b3b10521"></script>
    <script src="js/Ragdoll.js?v=0.1.0-b3b10521"></script>
    <script src="js/Character.js?v=0.1.0-b3b10521"></script>
    
    
    
    
    
    
    <!-- Скрипты игры (js/Game.js и её модули) — здесь, до main.js -->
    <script src="js/GameLang.js?v=0.1.0-b3b10521"></script>
    <script src="js/GameJelly.js?v=0.1.0-b3b10521"></script>
    <script src="js/GameGlyphs.js?v=0.1.0-b3b10521"></script>
    <script src="js/GameModels.js?v=0.1.0-b3b10521"></script>
    <script src="js/GameLevel.js?v=0.1.0-b3b10521"></script>

    <script src="js/GameSfx.js?v=0.1.0-b3b10521"></script>

    <script src="js/GameShopData.js?v=0.1.0-b3b10521"></script>

    <script src="js/Game.js?v=0.1.0-b3b10521"></script>
    <script src="js/main.js?v=0.1.0-b3b10521"></script>
    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
</body>
</html>
